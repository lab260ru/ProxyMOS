model:
  name: "mosnet"                 # Must match wrapper class name (MOSnet)
  device: "cuda"                # "cuda" or "cpu"
  checkpoint_path: "mosnet16_torch.pt"  # path to pretrained NISQA checkpoint

  # Optional model-specific params

# ----------------------------------------------------------

dataset:
  audio_dir: /home/maxim/MOS_research/tts_our
  file_extension: ".wav"
  recursive: true
  sample_rate: 16000                    

# ----------------------------------------------------------
inference:
  batch_size: 1                   # batch size (NISQA supports small batches)
  num_workers: 4                    # number of DataLoader workers
  prefetch_factor: 2                # optional for better throughput
  output_dir: "./results/mosnet/ttsbs1"     # where to save JSON/CSV results
  save_every_n_batches: 1    